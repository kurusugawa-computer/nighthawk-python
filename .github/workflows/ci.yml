name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          # Same dependency set and cache key as "test (3.13)". Only that job
          # saves the entry; concurrent writers race to reserve the same key.
          save-cache: false

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Format check
        run: uv run --no-sync ruff format --check .

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Type check
        run: uv run --no-sync pyright

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Sole writer of the per-Python-version dependency cache.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Run tests
        run: uv run --no-sync pytest -q

  build:
    name: Build distribution
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Keep packaging and its fresh installation check independent of the
      # source test job's dependency cache.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false

      - name: Build sdist and wheel
        run: uv build

      - name: Verify documented examples and types against the installed wheel
        run: |
          uv sync --locked --all-groups
          uv venv "$RUNNER_TEMP/nighthawk-distribution"
          uv pip install --python "$RUNNER_TEMP/nighthawk-distribution/bin/python" dist/*.whl
          NIGHTHAWK_DISTRIBUTION_PYTHON="$RUNNER_TEMP/nighthawk-distribution/bin/python" \
            uv run --no-sync pytest -q tests/docs/test_runtime_examples.py tests/distribution/

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
