description: Nighthawk production runtime and Python composition

prompts:
  - "{{natural_program}}"

commandLineOptions:
  cache: false
  maxConcurrency: 4

providers:
  - id: file://provider.py
    label: "openai-responses:gpt-5.6-luna"
    config:
      execution_model: "openai-responses:gpt-5.6-luna"
  - id: file://provider.py
    label: "claude-code-cli:haiku"
    config:
      execution_model: "claude-code-cli:haiku"
      execution_model_settings:
        allowed_tool_names: [nh_evaluate, nh_assign]
        max_turns: 25
        permission_mode: bypassPermissions
  - id: file://provider.py
    label: "codex:gpt-5.6-luna"
    config:
      execution_model: "codex:gpt-5.6-luna"
      execution_model_settings:
        allowed_tool_names: [nh_evaluate, nh_assign]

defaultTest:
  assert:
    - type: is-json
    - type: python
      value: file://assertions/outcome_kind.py

tests:
  - file://test_cases/binding_operations.yaml
  - file://test_cases/outcome_kinds.yaml
  - file://test_cases/tool_selection.yaml
  - file://test_cases/edge_cases.yaml
  - file://test_cases/loop_outcomes.yaml
  - file://test_cases/multi_step.yaml
  - file://test_cases/null_handling.yaml
